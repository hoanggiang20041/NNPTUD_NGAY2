<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer"> <title>Quản lý Sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .product-img-td { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; }
        .table-container { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .search-box { max-width: 400px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <h2 class="mb-4 fw-bold text-uppercase text-primary">📦 Hệ thống Sản Phẩm</h2>

        <div class="table-container">
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <div class="input-group search-box">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Tìm theo tên sản phẩm..." oninput="onSearchChange()">
                    </div>
                </div>
                <div class="col-md-6 text-md-end">
                    <div class="dropdown d-inline-block me-2">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            Sắp xếp theo Tên
                        </button>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-menu-item dropdown-item" href="#" onclick="handleSort('title', 'asc')">Tên A-Z</a></li>
                            <li><a class="dropdown-menu-item dropdown-item" href="#" onclick="handleSort('title', 'desc')">Tên Z-A</a></li>
                        </ul>
                    </div>
                    <div class="dropdown d-inline-block">
                        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                            Sắp xếp theo Giá
                        </button>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item" href="#" onclick="handleSort('price', 'asc')">Giá tăng dần</a></li>
                            <li><a class="dropdown-item" href="#" onclick="handleSort('price', 'desc')">Giá giảm dần</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="50">ID</th>
                            <th width="80">Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th>Danh mục</th>
                            <th>Giá</th>
                            <th class="text-end">Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body">
                        </tbody>
                </table>
            </div>
            <div id="noResult" class="text-center py-4 d-none">
                <p class="text-muted">Không tìm thấy sản phẩm nào phù hợp.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
