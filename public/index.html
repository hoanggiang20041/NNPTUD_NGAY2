<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Post & Comment - Full Database</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .deleted-row { text-decoration: line-through; opacity: 0.5; background-color: #fff5f5 !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="card p-4 mb-4">
        <h5 id="formTitle">Quản lý bài viết</h5>
        <div class="row g-2">
            <input type="hidden" id="editPostId">
            <div class="col-md-6"><input type="text" id="postTitle" class="form-control" placeholder="Tiêu đề..."></div>
            <div class="col-md-3"><input type="number" id="postViews" class="form-control" placeholder="Views"></div>
            <div class="col-md-3"><button class="btn btn-primary w-100" onclick="savePost()">Lưu Post</button></div>
        </div>
    </div>

    <div class="card p-4">
        <table class="table align-middle">
            <thead><tr><th>ID</th><th>Nội dung</th><th>Views</th><th class="text-end">Hành động</th></tr></thead>
            <tbody id="post-table-body"></tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="commentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Bình luận</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="comment-list" class="mb-3" style="max-height: 300px; overflow-y: auto;"></div>
                <hr>
                <div class="input-group">
                    <input type="hidden" id="editCmtId">
                    <input type="text" id="cmtText" class="form-control" placeholder="Viết bình luận...">
                    <button class="btn btn-success" id="btnSaveCmt" onclick="saveComment()">Gửi</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
